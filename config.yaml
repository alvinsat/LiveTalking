###############################################################################
#  LiveTalking Configuration
#  CLI arguments override values in this file
###############################################################################

# -------- Audio ----------------------------------------------------------
l: 10
m: 8
r: 10

# -------- Avatar Model ----------------------------------------------------------
model: ditto                   # ditto / musetalk / wav2lip / ultralight
avatar_id: wav2lip256_avatar1
batch_size: 16
inference_backend: openvino    # openvino / torch
openvino_device: AUTO          # GPU / AUTO (CPU inference is disabled)

# -------- Ditto live worker (used only when model: ditto) --------------------
ditto_root: ..\ditto-talkinghead
ditto_python: ''               # set to the Python executable in the Ditto GPU environment
ditto_data_root: .\checkpoints\ditto_onnx
ditto_cfg_pkl: .\checkpoints\ditto_cfg\v0.4_hubert_cfg_trt_online.pkl
ditto_source_path: ..\ditto-talkinghead\example\idle.mp4
ditto_idle_video_path: ..\ditto-talkinghead\example\idle.mp4
ditto_patch_region: lower_face
ditto_sampling_timesteps: 15
ditto_worker_host: 127.0.0.1
ditto_worker_port: 8765
ditto_cpu_threads: 4
ditto_max_size: 1024

# -------- Custom Actions ----------------------------------------------------------
customvideo_config: ''

# -------- TTS ----------------------------------------------------------
tts: edgetts                   # edgetts / gpt-sovits / cosyvoice / fishtts / tencent / doubao / indextts2 / azuretts / qwentts
REF_FILE: ''                   # voice name or reference audio file path (wav, 16kHz, mono)
REF_TEXT: ''                   # reference text for voice cloning (English or Chinese)
TTS_SERVER: ''                 # TTS server URL, no trailing slash

# -------- LLM ----------------------------------------------------------
llm_provider: dashscope        # dashscope / orcarouter
llm_model: ''                  # model override, empty = provider default (qwen-plus / orcarouter/auto)

# -------- Transport ----------------------------------------------------------
transport: webrtc              # rtcpush / webrtc / rtmp / virtualcam
stun: 'stun:stun.freeswitch.org:3478'  # stun server URL
push_url: ''                   # push URL for rtcpush/rtmp (not needed for webrtc/virtualcam)
max_session: 5                 # max concurrent sessions
listenport: 8010
